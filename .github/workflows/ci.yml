name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build universal Release binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          lipo -info .build/apple/Products/Release/HeadUp
